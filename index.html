<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LAS Point Cloud AR/VR Viewer</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- ADDED: A-Frame Extras (Required for movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <!-- Order matters: LASParser needs to be available before pointcloud-component -->
    <script src="js/las.js"></script>
    <script src="js/dem-components.js"></script>
    <script src="js/pointcloud-component.js"></script>
    <script src="simple-button-logger.js"></script>
    
    <!-- REMOVED: js/controller-to-wasd.js (No longer needed) -->

    <style>
        body { margin: 0; overflow: hidden; }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px; 
            color: white;
            background-color: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 8px; 
            z-index: 10001; 
            display: block; 
            text-align: center;
        }
        @media (max-width: 600px) {
            #loader {
                width: 80%;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="loader">Initializing...</div>

    <a-scene xr-mode-ui="XRMode:xr"
             background="color: #1A1A20"
             antialias="true"
             renderer="colorManagement: true; physicallyCorrectLights: true;"
             stats="false"
             debug="false">

        <a-assets>
            <!-- Assets here -->
        </a-assets>

        <!-- Wrapper for AR/VR scaling and positioning -->
        <a-entity id="ar-vr-world"
                  ar-scale-adjuster="arScale: 0.2; vrScale: 1; arYOffset: -0.2; vrYOffset: 0; defaultPosVR: 0 0 -1.5; defaultPosAR: 0 -0.1 -0.7">
            
            <!-- LAS Point Cloud Display -->
            <a-entity id="point-cloud-display"
                      las-point-cloud="src: ptCloud_subset.las;
                                       pointSize: 0.05;
                                       useIntensityAsGrayscale: true;
                                       centerCloud: true;"
                      position="0 0 0"
                      rotation="-90 0 0">
            </a-entity>
        </a-entity>

        <!-- Camera Rig 
             UPDATED: Using standard movement-controls (fly: true) from Source 
        -->
        <a-entity id="rig" position="0 1.6 0"
                  movement-controls="speed: 0.5; fly: true;">
            
            <a-camera id="camera" look-controls="enabled: true; magicWindowTrackingEnabled: false"></a-camera>

            <!-- Left Controller: Standard Movement -->
            <a-entity id="left-controller"
                      oculus-touch-controls="hand: left; model: true;"
                      vive-controls="hand: left; model: true;"
                      windows-motion-controls="hand: left; model: true;"
                      visible="true">
            </a-entity>

            <!-- Right Controller: Zoom Logic -->
            <a-entity id="right-controller"
                      oculus-touch-controls="hand: right; model: true;"
                      vive-controls="hand: right; model: true;"
                      windows-motion-controls="hand: right; model: true;"
                      vr-dem-zoom="targetEl: #ar-vr-world; speed: 1.5;"
                      simple-button-logger
                      visible="true">
            </a-entity>
        </a-entity>

        <!-- Lighting -->
        <a-light type="ambient" color="#BBB" intensity="0.7"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.5" position="-0.5 1 1"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.3" position="0.5 1 -1"></a-light>

    </a-scene>
</body>
</html>
